name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write        # publish test results as a check run

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (with Maven dependency cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit tests (surefire) + integration tests against real PostgreSQL via
      # Testcontainers (failsafe). Docker is available on GitHub-hosted Ubuntu runners.
      - name: Build and run all tests
        run: ./mvnw -B -ntp verify

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Test results
          path: target/surefire-reports/TEST-*.xml,target/failsafe-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: Upload raw test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: slotwise:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
