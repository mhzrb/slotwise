# Local / demo deployment: PostgreSQL + Slotwise.
#   cp .env.example .env    # then set real secrets
#   docker compose up --build
name: slotwise

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-slotwise}
      POSTGRES_USER: ${POSTGRES_USER:-slotwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: slotwise:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-slotwise}
      DB_USERNAME: ${POSTGRES_USER:-slotwise}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ characters) in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      BOOKING_MIN_NOTICE: ${BOOKING_MIN_NOTICE:-1h}
      BOOKING_CANCELLATION_CUTOFF: ${BOOKING_CANCELLATION_CUTOFF:-24h}
      BOOKING_RESCHEDULE_CUTOFF: ${BOOKING_RESCHEDULE_CUTOFF:-24h}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  postgres-data:
