app:
  security:
    jwt:
      # Test-only key (not used anywhere else).
      secret: test-secret-key-for-integration-tests-only-0123456789
  notifications:
    dispatcher:
      # Tests trigger dispatching explicitly for determinism.
      enabled: false

logging:
  level:
    com.slotwise: INFO
    org.testcontainers: WARN
    com.github.dockerjava: WARN
