spring:
  application:
    name: slotwise
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/slotwise}
    username: ${DB_USERNAME:slotwise}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      # Bound waits on row locks (e.g. the provider booking lock). Bookings hold the
      # lock for milliseconds; a wait this long signals contention, surfaced as 503.
      connection-init-sql: SET lock_timeout = '${DB_LOCK_TIMEOUT:5s}'
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates the mapping.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  security:
    jwt:
      # Must be at least 32 bytes. Supplied via environment; never committed.
      secret: ${JWT_SECRET:}
      issuer: slotwise
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}
  bootstrap:
    admin:
      # When both are set, an ADMIN account is created at startup if missing.
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
  booking:
    # Customers cannot book closer to the start time than this.
    min-booking-notice: ${BOOKING_MIN_NOTICE:1h}
    # How far into the future customers can book.
    max-booking-horizon: ${BOOKING_MAX_HORIZON:90d}
    # Customers may cancel up to this long before the start time.
    customer-cancellation-cutoff: ${BOOKING_CANCELLATION_CUTOFF:24h}
    # Customers may reschedule up to this long before the original start time.
    customer-reschedule-cutoff: ${BOOKING_RESCHEDULE_CUTOFF:24h}
    max-reschedules: ${BOOKING_MAX_RESCHEDULES:3}
    # Upper bound for the date range of a single slot query.
    max-slot-query-days: 31
  notifications:
    email:
      # "log" = development sender that logs messages instead of sending them
      sender: ${NOTIFICATIONS_EMAIL_SENDER:log}
    dispatcher:
      enabled: ${NOTIFICATIONS_DISPATCH_ENABLED:true}
      interval: 5s
      batch-size: 50
      max-attempts: 5
      retry-backoff: 1m

logging:
  level:
    root: INFO
    com.slotwise: INFO
    org.hibernate.SQL: WARN
